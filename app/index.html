<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Splitter</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="base.css">
<style>
  main{max-width:46rem}
  .people{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
  .chip{display:inline-flex;align-items:center;gap:.25rem;padding:.25rem .4rem .25rem .7rem;border:1px solid var(--line);border-radius:2rem;background:var(--card)}
  .chip button{border:0;background:transparent;padding:0 .3rem;color:var(--muted)}
  form{display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0}
  form input{min-width:0;flex:1}
  table{border-collapse:collapse;width:100%;margin:.5rem 0;font-variant-numeric:tabular-nums}
  td,th{padding:.35rem .5rem;border-bottom:1px solid var(--line);text-align:left}
  td.n,th.n{text-align:right}
  .del{border:0;background:transparent;color:var(--muted)}
  .settle li{margin:.3rem 0;font-size:1.05rem}
  .pos{color:var(--good)}.neg{color:var(--bad)}
  h2{font-size:1rem;margin:1.25rem 0 .25rem}
</style>
</head>
<body>
<main>
  <h1>Expense Splitter</h1>
  <p class="sub">Add who's in, then what each person paid. Everything is split equally. Saved in this browser.</p>
  <h2>People</h2>
  <div class="people" id="people"></div>
  <form id="add-person"><input id="person" placeholder="Add a name" maxlength="30" aria-label="Name"><button>Add</button></form>
  <h2>Expenses</h2>
  <form id="add-exp">
    <input id="what" placeholder="What for" maxlength="60" aria-label="What for">
    <input id="amount" placeholder="Amount" inputmode="decimal" style="max-width:8rem" aria-label="Amount">
    <select id="payer" aria-label="Paid by"></select>
    <button class="primary">Add</button>
  </form>
  <table><thead><tr><th>What</th><th>Paid by</th><th class="n">Amount</th><th></th></tr></thead><tbody id="exps"></tbody></table>
  <h2>Balances</h2>
  <table><tbody id="balances"></tbody></table>
  <h2>Settle up</h2>
  <ul class="settle" id="settle"></ul>
  <button id="reset">Start over</button>
</main>
<script src="app.js"></script>
</body>
</html>
